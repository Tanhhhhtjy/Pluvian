name: ablation_2_p7d_hicore
inherits: _base.yaml
model:
  # Same as ablation_2_new_7b_p7c (radar+PWV, gated fusion) EXCEPT the
  # intensity-stratified head gets a 6th band so it can represent >50 dBZ cores.
  # Old top band center was 50.0 -> hard ceiling. New: split the >30 dBZ band
  # into 30-50 (center 38) and >50 (center 65), lifting the ceiling to 65 dBZ.
  pwv_enabled: true
  pwv_concat_only: false
  era5_enabled: false
  mfd_channel_enabled: false
  gated_fusion: true
  intensity_stratified: true
  band_centers: [0.0, 0.5, 4.5, 19.0, 38.0, 65.0]
loss:
  data:
    type: intensity
    weight: 1.0
  intensity:
    ce_weight: 1.0
    reg_weight: 1.0
    band_edges: [0.1, 1.0, 8.0, 30.0, 50.0]
    band_sample_weights: [0.1, 1.0, 2.0, 4.0, 8.0, 12.0]
  fss:
    enabled: true
    thresholds: [1.0, 10.0, 30.0]
    threshold_weights: [1.0, 0.1, 0.1]
    window: 9
    weight: 0.1
  budget:
    enabled: false
hardware:
  precision: bf16
  grad_accum: 4
data:
  batch_size: 1
  num_workers: 8
