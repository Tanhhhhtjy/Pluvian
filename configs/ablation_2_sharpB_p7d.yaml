name: ablation_2_sharpB_p7d
inherits: _base.yaml
model:
  pwv_enabled: true
  pwv_concat_only: false
  era5_enabled: false
  mfd_channel_enabled: false
  gated_fusion: true
  intensity_stratified: true
  band_centers: [0.0, 0.5, 4.5, 19.0, 50.0]
optim:
  lr: 5.0e-5
  warmup_epochs: 1
  max_epochs: 18
loss:
  data:
    type: intensity
    weight: 1.0
  intensity:
    ce_weight: 1.0
    reg_weight: 1.0
    band_edges: [0.1, 1.0, 8.0, 30.0]
    band_sample_weights: [0.1, 1.0, 2.0, 4.0, 8.0]
  fss:
    enabled: true
    thresholds: [1.0, 10.0, 30.0]
    threshold_weights: [1.0, 1.0, 1.0]
    window: 9
    weight: 4.0         # aggressive: structure terms dominate harder
  spectral:
    enabled: true
    highpass: 1.5
    weight: 20.0
  budget:
    enabled: false
hardware:
  precision: bf16
  grad_accum: 4
data:
  batch_size: 1
  num_workers: 8
